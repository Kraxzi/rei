name: DB report (read-only)
on: workflow_dispatch
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-resolve-d1.mjs
      - name: Report
        run: |
          q() { echo "### $1" >> $GITHUB_STEP_SUMMARY; npx wrangler d1 execute rei --remote --json --command "$2" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0].results;if(!r.length){console.log("_empty_");return}
            const k=Object.keys(r[0]);console.log("|"+k.join("|")+"|");console.log("|"+k.map(()=>"---").join("|")+"|");
            for(const x of r)console.log("|"+k.map(c=>String(x[c]??"").replace(/\|/g,"/").replace(/\n/g," ").slice(0,220)).join("|")+"|")})' | tee -a $GITHUB_STEP_SUMMARY; echo >> $GITHUB_STEP_SUMMARY; }
          q "Users" "SELECT role, COUNT(*) n FROM users GROUP BY role"
          q "Search profiles" "SELECT name, regions, type_codes, is_active FROM search_profiles"
          q "Discoveries" "SELECT r.name region, d.status, d.found, d.without_website, d.excluded, d.error, d.created_at FROM region_discoveries d JOIN regions r ON r.id=d.region_id ORDER BY d.created_at DESC LIMIT 20"
          q "Sources by verdict" "SELECT region_id, verdict, decision, COUNT(*) n FROM sources GROUP BY 1,2,3"
          q "Sources" "SELECT name, base_url, verdict, connector, json_extract(audit,'$.reasons') reasons, json_extract(audit,'$.signals.listingLinkCount') links, json_extract(audit,'$.signals.hasListingJsonLd') jsonld FROM sources ORDER BY verdict, name LIMIT 120"
          q "AI calls" "SELECT day, model, ok, COUNT(*) n, SUM(tokens_in) tin FROM ai_calls GROUP BY 1,2,3"
