name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build PWA
        run: pnpm --filter @rei/web build
      - name: Resolve / create D1 database
        run: node scripts/ci-resolve-d1.mjs
      - name: Apply migrations
        run: npx wrangler d1 migrations apply rei --remote
      - name: Sync worker secrets
        env:
          BOOTSTRAP_CODE: ${{ secrets.BOOTSTRAP_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for name in BOOTSTRAP_CODE GEMINI_API_KEY; do
            val="${!name}"
            if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler secret put "$name" >/dev/null && echo "secret $name synced"; else echo "secret $name not set in GitHub"; fi
          done
      - name: Deploy worker
        run: npx wrangler deploy | tee deploy.log
      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "URL: $URL"
          curl -fsS "$URL/api/health" | tee /dev/stderr | grep -q '"propertyTypes":69'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/profiles")" = 401
          curl -fsS "$URL/api/auth/me"
          for p in / /index.html /manifest.webmanifest /sw.js; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' "$URL$p")"; done
          curl -fsS "$URL/" | grep -q '<div id="root">'
          curl -fsS "$URL/manifest.webmanifest" | grep -q '"display": "standalone"'
